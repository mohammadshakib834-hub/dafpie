<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="custom-card w-100" style="max-width: 600px; height: auto;">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none">
                        <h2 class="text-primary-theme fw-bold"><i class="bi bi-box2-heart"></i> DAFPIE</h2>
                    </a>
                    <p class="text-muted">Create a new account</p>
                </div>

                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">I want to join as</label>
                            <select class="form-select border-primary" id="role" required>
                                <option value="DONOR">Donor (Restaurant/Individual)</option>
                                <option value="NGO">NGO / Organization</option>
                                <option value="VOLUNTEER">Delivery Volunteer</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Full Name / Org Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">City</label>
                            <input type="text" class="form-control" id="city" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Full Address</label>
                            <input type="text" class="form-control" id="address">
                        </div>

                        <!-- NGO specific fields -->
                        <div class="col-12" id="ngoFields" style="display: none;">
                            <div class="card bg-light border-0 p-3 mt-2">
                                <h6 class="text-primary-theme mb-3"><i class="bi bi-building"></i> NGO Details</h6>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Registration Number</label>
                                        <input type="text" class="form-control" id="registrationNumber">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">People Served (Capacity)</label>
                                        <input type="number" class="form-control" id="peopleServedCapacity">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Volunteer specific fields -->
                        <div class="col-12" id="volunteerFields" style="display: none;">
                            <div class="card bg-light border-0 p-3 mt-2">
                                <h6 class="text-primary-theme mb-3"><i class="bi bi-bicycle"></i> Volunteer Details</h6>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Vehicle Type</label>
                                        <select class="form-select" id="vehicleType">
                                            <option value="None">None</option>
                                            <option value="Bicycle">Bicycle</option>
                                            <option value="Bike">Bike/Scooter</option>
                                            <option value="Car">Car</option>
                                            <option value="Van">Van</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Vehicle Number</label>
                                        <input type="text" class="form-control" id="vehicleNumber">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary-custom w-100">Register</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <span class="text-muted">Already have an account?</span>
                    <a href="login.html" class="text-primary-theme text-decoration-none fw-bold ms-1">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check URL for role parameter
        const urlParams = new URLSearchParams(window.location.search);
        const preselectRole = urlParams.get('role');
        if (preselectRole) {
            const roleSelect = document.getElementById('role');
            if (roleSelect) {
                roleSelect.value = preselectRole;
                roleSelect.dispatchEvent(new Event('change'));
            }
        }
    </script>
</body>
</html>
