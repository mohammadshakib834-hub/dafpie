<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light navbar-custom border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="bi bi-box2-heart text-primary-theme"></i> DAFPIE</a>
            <div class="d-flex align-items-center">
                <span class="me-3 fw-bold" id="userNameDisplay">NGO</span>
                <button onclick="logout()" class="btn btn-secondary-custom btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="sidebar">
            <a href="ngo-dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="food-list.html" class="sidebar-link"><i class="bi bi-search"></i> Find Food</a>
            <a href="#" class="sidebar-link"><i class="bi bi-check-circle"></i> Accepted Donations</a>
            <a href="#" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
        </div>

        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">NGO Dashboard</h3>
                <a href="food-list.html" class="btn btn-primary-custom"><i class="bi bi-search"></i> Find Food Now</a>
            </div>

            <!-- Dashboard lists will be populated by JS -->
            <div class="row g-4 mb-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold mb-4">My Accepted Donations</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Food</th>
                                            <th>Quantity</th>
                                            <th>Pickup Location</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ngoDonationsTableBody">
                                        <tr><td colspan="5" class="text-center py-3">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Volunteer Modal -->
    <div class="modal fade" id="volunteerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Request Volunteer Pickup</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Special Instructions for Volunteer</label>
                        <textarea class="form-control" id="volunteerInstructions" rows="3" placeholder="E.g. Call this number upon arrival..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" id="confirmVolunteerBtn">Confirm Request</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ngo.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AuthState.getUser();
            if (!user || user.role !== 'NGO') {
                window.location.href = 'login.html';
                return;
            }
            loadNgoDashboard();
        });
    </script>
</body>
</html>
