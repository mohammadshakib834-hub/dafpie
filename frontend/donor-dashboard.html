<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="bi bi-box2-heart text-primary-theme"></i> DAFPIE</a>
            <div class="d-flex align-items-center">
                <span class="me-3 fw-bold" id="userNameDisplay">Donor</span>
                <button onclick="logout()" class="btn btn-secondary-custom btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a href="donor-dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="donate.html" class="sidebar-link"><i class="bi bi-plus-circle"></i> Donate Food</a>
            <a href="#" class="sidebar-link"><i class="bi bi-clock-history"></i> My Donations</a>
            <a href="#" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Donor Dashboard</h3>
                <a href="donate.html" class="btn btn-primary-custom"><i class="bi bi-plus-lg"></i> New Donation</a>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4" id="donorStats">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon primary"><i class="bi bi-heart"></i></div>
                        <div class="stat-details">
                            <h3 id="totalDonations">0</h3>
                            <p>Total Donations</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon secondary"><i class="bi bi-hourglass-split"></i></div>
                        <div class="stat-details">
                            <h3 id="pendingDonations">0</h3>
                            <p>Pending</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon info"><i class="bi bi-truck"></i></div>
                        <div class="stat-details">
                            <h3 id="acceptedDonations">0</h3>
                            <p>Accepted/Ongoing</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon danger"><i class="bi bi-check-circle"></i></div>
                        <div class="stat-details">
                            <h3 id="completedDonations">0</h3>
                            <p>Completed</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Donations -->
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="card-title fw-bold mb-4">My Recent Donations</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Food</th>
                                    <th>Quantity</th>
                                    <th>Expiry Time</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="donationsTableBody">
                                <tr><td colspan="5" class="text-center text-muted py-4">Loading your donations...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/donation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AuthState.getUser();
            if (!user || user.role !== 'DONOR') {
                window.location.href = 'login.html';
                return;
            }
            loadDonorDashboard();
        });
    </script>
</body>
</html>
