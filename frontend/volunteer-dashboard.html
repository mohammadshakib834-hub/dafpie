<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Dashboard - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light navbar-custom border-bottom">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="index.html"><i class="bi bi-box2-heart text-primary-theme"></i> DAFPIE</a>
            <div class="d-flex align-items-center">
                <span class="me-3 fw-bold" id="userNameDisplay">Volunteer</span>
                <button onclick="logout()" class="btn btn-secondary-custom btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="sidebar">
            <a href="volunteer-dashboard.html" class="sidebar-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
            <a href="#" class="sidebar-link"><i class="bi bi-person"></i> Profile</a>
        </div>

        <div class="main-content">
            <h3 class="mb-4">Volunteer Dashboard</h3>

            <div class="row g-4 mb-4">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold mb-4"><i class="bi bi-geo-alt-fill text-danger"></i> Available Pickups</h5>
                            <div id="availablePickupsList">
                                <p class="text-muted text-center py-3">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <h5 class="card-title fw-bold mb-4"><i class="bi bi-truck text-primary-theme"></i> My Active Deliveries</h5>
                            <div id="myPickupsList">
                                <p class="text-muted text-center py-3">Loading...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Delivery Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Status</label>
                        <select class="form-select" id="newStatus">
                            <option value="PICKED_UP">Picked Up</option>
                            <option value="ON_THE_WAY">On The Way</option>
                            <option value="DELIVERED">Delivered</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Delivery Notes (Optional)</label>
                        <textarea class="form-control" id="deliveryNotes" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" id="confirmStatusBtn">Update Status</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/volunteer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = AuthState.getUser();
            if (!user || user.role !== 'VOLUNTEER') {
                window.location.href = 'login.html';
                return;
            }
            loadVolunteerDashboard();
        });
    </script>
</body>
</html>
