<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Food - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom border-bottom bg-white">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-box2-heart text-primary-theme"></i> DAFPIE</a>
            <div class="d-flex align-items-center">
                <a href="donor-dashboard.html" class="btn btn-outline-custom me-2">Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="custom-card p-4 p-md-5">
                    <h3 class="mb-4 fw-bold">Donate Surplus Food</h3>
                    <div class="food-safety-banner mb-4">
                        <strong><i class="bi bi-exclamation-triangle"></i> Important:</strong> 
                        Please ensure the food is safe, hygienic, and suitable for human consumption.
                    </div>

                    <form id="donationForm">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-bold">Food Name/Title</label>
                                <input type="text" class="form-control" id="foodName" placeholder="e.g. Vegetable Biryani" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Food Type</label>
                                <select class="form-select" id="foodType" required>
                                    <option value="VEG">Vegetarian</option>
                                    <option value="NON_VEG">Non-Vegetarian</option>
                                    <option value="VEGAN">Vegan</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="COOKED_FOOD">Cooked Food</option>
                                    <option value="RAW_INGREDIENTS">Raw Ingredients</option>
                                    <option value="PACKAGED_FOOD">Packaged Food</option>
                                    <option value="BAKERY">Bakery Items</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Quantity</label>
                                <input type="number" class="form-control" id="quantity" min="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Unit</label>
                                <select class="form-select" id="unit" required>
                                    <option value="Plates">Plates/Meals</option>
                                    <option value="Kg">Kilograms (Kg)</option>
                                    <option value="Litres">Litres</option>
                                    <option value="Pieces">Pieces</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Preparation Time</label>
                                <input type="datetime-local" class="form-control" id="preparationTime" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Best Before / Expiry Time</label>
                                <input type="datetime-local" class="form-control" id="expiryTime" required>
                            </div>
                            
                            <div class="col-12 mt-4"><h5 class="border-bottom pb-2">Pickup Details</h5></div>
                            
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Pickup City</label>
                                <input type="text" class="form-control" id="city" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Contact Number</label>
                                <input type="tel" class="form-control" id="contactNumber" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Full Pickup Address</label>
                                <input type="text" class="form-control" id="pickupAddress" required>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label fw-bold">Description / Additional Notes</label>
                                <textarea class="form-control" id="description" rows="3" placeholder="Any specific details about the food or pickup instructions..."></textarea>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary-custom w-100 btn-lg">Submit Donation</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/donation.js"></script>
</body>
</html>
