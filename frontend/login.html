<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DAFPIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        <div class="custom-card w-100" style="max-width: 450px; height: auto;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none">
                        <h2 class="text-primary-theme fw-bold"><i class="bi bi-box2-heart"></i> DAFPIE</h2>
                    </a>
                    <p class="text-muted">Login to your account</p>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email address</label>
                        <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" id="password" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Login</button>
                </form>
                
                <div class="text-center">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="register.html" class="text-primary-theme text-decoration-none fw-bold ms-1">Register here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
